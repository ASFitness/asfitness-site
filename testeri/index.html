<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Testeri Fondatori · ASFitness</title>
  <meta name="description" content="20 de locuri pentru Testeri Fondatori ASFitness: Ultra Premium gratuit 3 luni și prețul de fondator după." />
  <meta name="theme-color" content="#07060B" />
  <link rel="icon" href="../img/icon-512.png" />
  <meta property="og:title" content="Testeri Fondatori · ASFitness" />
  <meta property="og:description" content="20 de locuri. Ultra Premium gratuit 3 luni + prețul de fondator." />
  <meta property="og:image" content="https://asfitness.ro/img/icon-512.png" />
  <script defer src="https://cloud.umami.is/script.js" data-website-id="96fd8a49-ad70-41f5-98e1-012f7d01f280" data-domains="asfitness.ro,www.asfitness.ro"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Exo+2:ital,wght@1,900&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root { --bg: #07060B; --card: #120F1C; --border: rgba(255,255,255,.09); --violet: #7C3AED; --violet-l: #A78BFA; --lav: #C4B5FD; --lav2: #EDE9FE; --text: #fff; --muted: #A6A2B8; }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--text); font-family: 'DM Sans', system-ui, sans-serif; line-height: 1.55; -webkit-font-smoothing: antialiased; }
    body::before { content: ''; position: fixed; inset: 0; z-index: -1; background: radial-gradient(60% 45% at 50% 0%, rgba(124,58,237,.35), transparent 70%), radial-gradient(40% 40% at 100% 100%, rgba(76,29,149,.25), transparent 70%); }
    a { color: var(--lav); }
    .wrap { max-width: 760px; margin: 0 auto; padding: 0 18px; }
    header { display: flex; align-items: center; justify-content: space-between; padding: 18px 0; }
    .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: #fff; }
    .brand img { width: 36px; height: 36px; border-radius: 50%; }
    .brand b { font: 900 italic 20px/1 'Exo 2', sans-serif; letter-spacing: 2px; }
    .lang a { color: var(--muted); text-decoration: none; font-weight: 700; font-size: 14px; margin-left: 12px; cursor: pointer; }
    .lang a.on { color: var(--violet-l); }
    .kicker { font: 700 12px/1 'DM Sans'; letter-spacing: .28em; color: var(--violet-l); text-transform: uppercase; margin-top: 28px; }
    h1 { font: 900 clamp(44px, 9vw, 84px)/.9 'Barlow Condensed', sans-serif; text-transform: uppercase; margin: 12px 0 14px; }
    h1 em { font-style: normal; background: linear-gradient(100deg,#8B5CF6,#EDE9FE 55%,#7C3AED); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .lead { color: var(--muted); font-size: 17px; max-width: 600px; }
    .pill { display: inline-block; margin-top: 16px; padding: 9px 14px; border-radius: 999px; background: rgba(124,58,237,.18); border: 1px solid rgba(167,139,250,.4); font-weight: 700; font-size: 14px; color: var(--lav2); }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin: 30px 0; }
    .box { background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 18px; }
    .box h2 { font: 800 22px/1 'Barlow Condensed'; text-transform: uppercase; margin: 0 0 10px; }
    .box ul { margin: 0; padding-left: 18px; color: var(--muted); }
    .box li { margin: 6px 0; }
    .box li b { color: #fff; }
    .gift { border-color: rgba(167,139,250,.45); background: linear-gradient(160deg, rgba(109,40,217,.28), var(--card) 70%); }
    form { background: var(--card); border: 1px solid rgba(167,139,250,.35); border-radius: 20px; padding: 22px; margin-bottom: 40px; }
    form h2 { font: 800 28px/1 'Barlow Condensed'; text-transform: uppercase; margin: 0 0 6px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    label { display: block; font-weight: 700; font-size: 14px; margin: 14px 0 6px; }
    label small { font-weight: 400; color: var(--muted); }
    input[type=text], input[type=email], input[type=tel], input[type=number], textarea { width: 100%; padding: 13px 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.04); color: #fff; font: 16px 'DM Sans'; }
    textarea { min-height: 90px; resize: vertical; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chips label { margin: 0; font-weight: 500; padding: 10px 14px; border-radius: 999px; border: 1px solid rgba(255,255,255,.14); cursor: pointer; }
    .chips input { position: absolute; opacity: 0; pointer-events: none; }
    .chips input:checked + span { color: #fff; }
    .chips label:has(input:checked) { background: var(--violet); border-color: var(--violet); }
    .check { display: flex; gap: 10px; align-items: flex-start; font-weight: 400; color: var(--muted); }
    .check input { margin-top: 4px; width: 18px; height: 18px; accent-color: var(--violet); }
    .hide { display: none; }
    button { width: 100%; margin-top: 20px; padding: 16px; border: 0; border-radius: 999px; background: linear-gradient(100deg,#6D28D9,#8B5CF6); color: #fff; font: 700 17px 'DM Sans'; cursor: pointer; box-shadow: 0 12px 40px rgba(124,58,237,.45); }
    button:disabled { opacity: .6; }
    .msg { margin-top: 14px; font-weight: 700; }
    .msg.ok { color: #86EFAC; } .msg.err { color: #FCA5A5; }
    .done { text-align: center; padding: 34px 18px; }
    .done h2 { font: 900 40px/1 'Barlow Condensed'; text-transform: uppercase; margin: 0 0 10px; }
    footer { color: var(--muted); font-size: 13px; padding: 20px 0 40px; border-top: 1px solid var(--border); }
    @media (max-width: 620px) { .grid, .row { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <a class="brand" href="../"><img src="../img/icon-512.png" alt="" /><b>ASFITNESS</b></a>
      <div class="lang"><a data-l="ro" class="on">RO</a><a data-l="en">EN</a></div>
    </header>

    <div class="kicker" data-ro="Testeri Fondatori · 15–22 decembrie" data-en="Founding Testers · 15–22 December"></div>
    <h1 data-ro="Caut <em>20 de oameni</em> care să testeze ASFitness." data-en="Looking for <em>20 people</em> to test ASFitness."></h1>
    <p class="lead" data-ro="Am construit ASFitness din iulie 2025: antrenament, nutriție, refacere și mindset, într-o singură aplicație. Înainte de lansare (1 februarie 2027) am nevoie de 20 de oameni care o folosesc zilnic și îmi spun sincer ce cred." data-en="I have been building ASFitness since July 2025: training, nutrition, recovery and mindset in one app. Before launch (1 February 2027) I need 20 people to use it daily and tell me honestly what they think."></p>
    <span class="pill" data-ro="20 de locuri · alegem noi testerii până pe 23 decembrie" data-en="20 spots · we choose the testers by 23 December"></span>

    <div class="grid">
      <div class="box gift">
        <h2 data-ro="Ce primești" data-en="What you get"></h2>
        <ul data-ro="<li><b>Ultra Premium gratuit 3 luni</b></li><li><b>Prețul de fondator</b> după (cel mai mic, păstrat cât ai abonamentul)</li><li>Acces la aplicație <b>înaintea tuturor</b></li><li>Numele tău la „Mulțumiri” (doar dacă vrei)</li>" data-en="<li><b>Ultra Premium free for 3 months</b></li><li><b>The founder price</b> afterwards (the lowest, kept while you stay subscribed)</li><li>Access to the app <b>before everyone else</b></li><li>Your name in the “Thanks” (only if you want)</li>"></ul>
      </div>
      <div class="box">
        <h2 data-ro="Ce îți cer" data-en="What I ask"></h2>
        <ul data-ro="<li>Să folosești aplicația <b>zilnic, 2 săptămâni</b></li><li>Un formular scurt de feedback <b>o dată pe săptămână</b></li><li>Să-mi spui <b>sincer</b> ce nu-ți place</li><li>Opțional: un story despre aplicație</li>" data-en="<li>Use the app <b>daily for 2 weeks</b></li><li>A short feedback form <b>once a week</b></li><li>Tell me <b>honestly</b> what you don’t like</li><li>Optional: a story about the app</li>"></ul>
      </div>
    </div>

    <form id="f" novalidate>
      <h2 data-ro="Înscrie-te" data-en="Apply"></h2>
      <p class="lead" style="font-size:14px" data-ro="Durează un minut." data-en="It takes one minute."></p>
      <div class="row">
        <div><label for="name" data-ro="Prenume" data-en="First name"></label><input id="name" type="text" maxlength="60" required autocomplete="given-name" /></div>
        <div><label for="email">Email</label><input id="email" type="email" maxlength="254" required autocomplete="email" /></div>
      </div>
      <div class="row">
        <div><label for="age" data-ro="Vârsta" data-en="Age"></label><input id="age" type="number" min="10" max="99" inputmode="numeric" /></div>
        <div><label for="phone"><span data-ro="Telefon / WhatsApp" data-en="Phone / WhatsApp"></span> <small data-ro="(opțional)" data-en="(optional)"></small></label><input id="phone" type="tel" maxlength="30" autocomplete="tel" /></div>
      </div>
      <label data-ro="Ce sport faci?" data-en="What do you do?"></label>
      <div class="chips" id="sport">
        <label><input type="radio" name="sport" value="fotbal" /><span data-ro="Fotbal" data-en="Football"></span></label>
        <label><input type="radio" name="sport" value="fitness" /><span data-ro="Sală / Fitness" data-en="Gym / Fitness"></span></label>
        <label><input type="radio" name="sport" value="hybrid" /><span data-ro="Hybrid (alergare, padel…)" data-en="Hybrid (running, padel…)"></span></label>
        <label><input type="radio" name="sport" value="altul" /><span data-ro="Altul" data-en="Other"></span></label>
      </div>
      <label data-ro="Ce telefon ai?" data-en="Which phone do you have?"></label>
      <div class="chips" id="device">
        <label><input type="radio" name="device" value="android" /><span>Android</span></label>
        <label><input type="radio" name="device" value="iphone" /><span>iPhone</span></label>
      </div>
      <label for="why"><span data-ro="De ce vrei să fii tester?" data-en="Why do you want to be a tester?"></span> <small data-ro="(opțional)" data-en="(optional)"></small></label>
      <textarea id="why" maxlength="600"></textarea>
      <label for="ig"><span>Instagram / TikTok</span> <small data-ro="(opțional)" data-en="(optional)"></small></label>
      <input id="ig" type="text" maxlength="60" placeholder="@" />
      <label class="check hide" id="parentRow"><input type="checkbox" id="parent" /><span data-ro="Am sub 16 ani și părintele meu e de acord să mă înscriu." data-en="I am under 16 and my parent agrees to my application."></span></label>
      <label class="check"><input type="checkbox" id="consent" /><span data-ro="Sunt de acord ca ASFitness să-mi folosească datele doar pentru programul de testeri. Detalii în <a href='../confidentialitate.html'>politica de confidențialitate</a>." data-en="I agree that ASFitness uses my data only for the tester programme. Details in the <a href='../confidentialitate.html?lang=en'>privacy policy</a>."></span></label>
      <button type="submit" id="go" data-ro="Vreau să fiu Tester Fondator" data-en="I want to be a Founding Tester"></button>
      <div class="msg" id="msg"></div>
    </form>

    <div class="box done hide" id="done">
      <h2 data-ro="Te-am înscris!" data-en="You’re in the list!"></h2>
      <p class="lead" style="margin:0 auto" data-ro="Până pe 23 decembrie îți scriem pe email dacă ai fost ales. Mulțumesc că vrei să construim ASFitness împreună." data-en="By 23 December we will email you if you were chosen. Thank you for helping build ASFitness."></p>
    </div>

    <footer>© 2025–2026 ASFitness Performance · <a href="../">asfitness.ro</a> · <a href="../confidentialitate.html">Confidențialitate</a> · contact@asfitness.ro</footer>
  </div>

  <script>
    (() => {
      const SB = 'https://vrrnqkgukcdnykeobglj.supabase.co', SBK = 'sb_publishable_hi4OatsEILAoiIBSQzpNjg_jQbj4dUq';
      const CLOSE = Date.parse('2026-12-23T00:00:00+02:00');
      let L = 'ro';
      try { L = new URLSearchParams(location.search).get('lang') || localStorage.getItem('asf.lang') || ((navigator.language || 'ro').toLowerCase().startsWith('ro') ? 'ro' : 'en'); } catch (e) {}
      if (L !== 'en') L = 'ro';
      const T = {
        ro: { need: 'Completează prenumele, emailul, sportul și ce telefon ai.', consent: 'Bifează acordul pentru date ca să te putem înscrie.', parent: 'Sub 16 ani ai nevoie de acordul părintelui (bifează căsuța).', already: 'Ești deja înscris cu acest email. Te anunțăm până pe 23 decembrie.', closed: 'Înscrierile s-au închis. Pe 1 ianuarie se deschid locurile de fondator pe asfitness.ro.', err: 'N-a mers. Încearcă din nou sau scrie-ne la contact@asfitness.ro.', sending: 'Se trimite…' },
        en: { need: 'Fill in your first name, email, sport and which phone you have.', consent: 'Tick the data consent so we can add you.', parent: 'Under 16 you need your parent’s consent (tick the box).', already: 'You are already on the list with this email. We will let you know by 23 December.', closed: 'Applications are closed. Founder spots open on 1 January on asfitness.ro.', err: 'Something went wrong. Try again or write to contact@asfitness.ro.', sending: 'Sending…' },
      };
      function apply() {
        document.documentElement.lang = L;
        document.querySelectorAll('[data-ro]').forEach((el) => (el.innerHTML = el.dataset[L] || el.dataset.ro));
        document.querySelectorAll('.lang a').forEach((a) => a.classList.toggle('on', a.dataset.l === L));
        document.title = L === 'en' ? 'Founding Testers · ASFitness' : 'Testeri Fondatori · ASFitness';
        if (Date.now() >= CLOSE) closed();
      }
      document.querySelectorAll('.lang a').forEach((a) => a.addEventListener('click', () => { L = a.dataset.l; try { localStorage.setItem('asf.lang', L); } catch (e) {} apply(); }));
      const $ = (id) => document.getElementById(id);
      const msg = (t, ok) => { $('msg').textContent = t; $('msg').className = 'msg ' + (ok ? 'ok' : 'err'); };
      function closed() { $('f').classList.add('hide'); $('done').classList.remove('hide'); $('done').querySelector('h2').textContent = L === 'en' ? 'Applications closed' : 'Înscrierile s-au închis'; $('done').querySelector('p').textContent = T[L].closed; }
      $('age').addEventListener('input', () => { const a = Number($('age').value); $('parentRow').classList.toggle('hide', !(a && a < 16)); });
      $('f').addEventListener('submit', async (e) => {
        e.preventDefault();
        const sport = document.querySelector('input[name=sport]:checked')?.value, device = document.querySelector('input[name=device]:checked')?.value;
        const name = $('name').value.trim(), email = $('email').value.trim().toLowerCase(), age = $('age').value ? Number($('age').value) : null;
        if (!name || !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email) || !sport || !device) return msg(T[L].need);
        if (!$('consent').checked) return msg(T[L].consent);
        if (age && age < 16 && !$('parent').checked) return msg(T[L].parent);
        $('go').disabled = true; msg(T[L].sending, true);
        let res = 'err';
        try {
          const r = await fetch(SB + '/rest/v1/rpc/apply_tester', { method: 'POST', headers: { apikey: SBK, 'Content-Type': 'application/json' },
            body: JSON.stringify({ p_first_name: name, p_email: email, p_sport: sport, p_device: device, p_phone: $('phone').value.trim() || null, p_age: age,
              p_why: $('why').value.trim() || null, p_instagram: $('ig').value.trim() || null, p_parent_ok: $('parent').checked, p_lang: L,
              p_source: (new URLSearchParams(location.search).get('utm_source') || 'site').slice(0, 60) }) });
          res = r.ok ? await r.json() : 'err';
        } catch (err) { res = 'err'; }
        $('go').disabled = false;
        if (res === 'ok') { try { window.umami && window.umami.track('tester_apply', { sport, device }); } catch (err) {} $('f').classList.add('hide'); $('done').classList.remove('hide'); scrollTo({ top: 0, behavior: 'smooth' }); }
        else if (res === 'closed') closed();
        else msg(T[L][res] || T[L].err);
      });
      apply();
    })();
  </script>
</body>
</html>
